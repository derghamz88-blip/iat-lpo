#login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:6px;margin:6px 0 10px;background:#fff}
details.names{margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:6px}
details.names summary{padding:12px 14px;cursor:pointer;font:600 17px var(--cond)}

<script type="module">
// ================= SETTINGS =================
// Paste the firebaseConfig object from the inventory app here to share saved names with the team.
// Leave it as null to save names on this device only.
const FIREBASE_CONFIG = null;
// ============================================
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

// ===== LPO parsers (shared by the app and the node test) =====
function buildLines(items){
  // items: [{str,x,y,w}] (y grows downward). Group into lines.
  const its=items.filter(i=>i.str&&i.str.trim()).sort((a,b)=>a.y-b.y||a.x-b.x);
  const lines=[];
  for(const it of its){
    if(its.some(o=>o!==it&&o._keep&&o.str===it.str&&Math.abs(o.x-it.x)<1.5&&Math.abs(o.y-it.y)<1.5))continue;
    it._keep=true;
    let L=lines.find(l=>Math.abs(l.y-it.y)<=2.5);
    if(!L){L={y:it.y,items:[]};lines.push(L)}
    L.items.push(it);
  }
  lines.sort((a,b)=>a.y-b.y);
  lines.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);l.text=l.items.map(i=>i.str.trim()).join(' ')});
  return lines;
}
const findItem=(lines,re,from=0)=>{for(let i=from;i<lines.length;i++){const it=lines[i].items.find(t=>re.test(t.str));if(it)return{li:i,it}}return null};
const inRange=(it,a,b)=>it.x>=a&&it.x<b;
const num=s=>parseFloat(String(s).replace(/,/g,''));

const UOM_RE=/^(KG|KGS|PCS|PC|EA|EACH|CTN|PKT|PACK|NOS|BOX|TRAY|TRY|UNIT)$/i;
// Row-based table: a row starts with number codes; then description words; then UOM; then qty.
// Lines in between that hold only words are the wrapped rest of the description.
function readRows(lines,cfg){
  const h=findItem(lines,cfg.headerRe);if(!h)return[];
  const rows=[];let cur=null;
  for(let i=h.li+1;i<lines.length;i++){
    const L=lines[i];if(cfg.stopRe.test(L.text))break;
    const toks=L.items.map(t=>t.str.trim()).filter(Boolean);
    let k=0;const codes=[];
    while(k<toks.length&&/^\d{5,14}$/.test(toks[k]))codes.push(toks[k++]);
    if(/^Page\s*:?\s*\d/i.test(L.text)||/Purchase Order|Order No\.|Delivered To|^Barcode\b/i.test(L.text)){cur=null;continue}
    if(codes.length>=cfg.minCodes){
      cur={codes,desc:[],uom:'',qty:null,lastY:L.y};rows.push(cur);
      for(;k<toks.length;k++){
        const t=toks[k];
        if(!cur.uom&&UOM_RE.test(t)&&k+1<toks.length&&/^[\d.,]+$/.test(toks[k+1])){cur.uom=t.toUpperCase();cur.qty=num(toks[k+1]);break}
        cur.desc.push(t);
      }
    }else if(cur&&L.y-cur.lastY<18&&toks.length<=6&&toks.every(t=>!/^[\d.,]+$/.test(t))){
      cur.desc.push(...toks);cur.lastY=L.y;
    }
  }
  return rows.map(r=>({codes:r.codes,desc:r.desc.join(' ').replace(/\s+/g,' ').trim(),uom:r.uom,qty:r.qty}))
             .filter(r=>r.desc&&r.qty>0);
}
// Text under a header, limited to a horizontal band
function textBelow(lines,headRe,xFrom,xTo,stopRe){
  const h=findItem(lines,headRe);if(!h)return[];
  const out=[];
  for(let i=h.li+1;i<lines.length;i++){
    if(stopRe&&stopRe.test(lines[i].text))break;
    const s=lines[i].items.filter(t=>t.x>=xFrom(h.it,lines)&&t.x<xTo(h.it,lines)).map(t=>t.str.trim()).join(' ').trim();
    if(s)out.push(s);
  }
  return out;
}
// GMG repeats the name in the address and glues them: "GEANT EXPRESS -ONE PARK" + "AVENUEGEANT EXPRESS -ONE PARK" ...
function unglue(col){
  const joined=col.join(' ').replace(/\s+/g,' ').trim();
  const head=(col[0]||'').slice(0,8);
  const i=head.length>=5?joined.indexOf(head,1):-1;
  return (i>0?joined.slice(0,i):(col[0]||'')).trim();
}
// Row table where columns are found from header x positions (Union Coop style)
function readByColumns(lines,cfg){
  const h=findItem(lines,cfg.headerRe);if(!h)return[];
  const hdr=lines.slice(h.li,h.li+3).flatMap(l=>l.items);
  const hx=re=>{const it=hdr.find(t=>re.test(t.str.trim()));return it?it.x:null};
  const xBrand=hx(cfg.brandRe),xQty=hx(cfg.qtyRe),xCost=hx(cfg.afterQtyRe);
  if(xBrand==null||xQty==null)return[];
  const rows=[];let cur=null;
  for(let i=h.li+1;i<lines.length;i++){
    const L=lines[i];if(cfg.stopRe.test(L.text))break;
    const toks=L.items;
    const isRow=toks.length>3&&/^\d{1,3}$/.test(toks[0].str.trim())&&/^\d{5,8}$/.test(toks[1].str.trim());
    if(isRow){
      const codeEnd=toks[2]&&/^\d{4,14}$/.test(toks[2].str.trim())?toks[2].x+20:toks[1].x+20;
      cur={code:toks[1].str.trim(),desc:[],uom:'KG',qty:null,codeEnd};rows.push(cur);
      for(const t of toks){
        const v=t.str.trim();
        if(t.x>codeEnd&&t.x<xBrand-50)cur.desc.push(v);
        else if(t.x>=xQty-15&&t.x<(xCost??xQty+50)-5&&cur.qty==null&&/^[\d.,]+$/.test(v))cur.qty=num(v);
      }
      const u=toks.filter(t=>t.x>xBrand&&t.x<xQty-15&&UOM_RE.test(t.str.trim()));
      if(u.length)cur.uom=u[u.length-1].str.trim().toUpperCase();
    }else if(cur){
      const words=toks.filter(t=>t.x>cur.codeEnd&&t.x<xBrand-50).map(t=>t.str.trim());
      if(words.length&&toks.every(t=>t.x>cur.codeEnd&&t.x<xBrand-50))cur.desc.push(...words);
    }
  }
  return rows.map(r=>({code:r.code,desc:r.desc.join(' ').replace(/\s+/g,' ').trim(),uom:r.uom,qty:r.qty})).filter(r=>r.desc&&r.qty>0);
}

const PARSERS=[
 {id:'GMG',name:'GMG',
  detect:t=>/GMG/i.test(t)&&/Purchase Order/i.test(t),
  parse(lines,flat){
    const po=(flat.match(/Order No\.?.*?\b(\d{6,})\b/)||[])[1]||'';
    const delivery=(flat.match(/Delivery Date.*?\b(\d{2}[./]\d{2}[./]\d{4})/)||[])[1]||'';
    const vend=findItem(lines,/TRADING/i);
    const col=textBelow(lines,/^Delivered To/i,h=>h.x-45,()=>vend?vend.it.x-5:h.x+90,/Delivery Date/i);
    const branch=unglue(col);
    const rows=readRows(lines,{headerRe:/^Barcode$/i,stopRe:/^Total\b/i,minCodes:2});
    return {po,delivery,branch,lines:rows.map(r=>({code:r.codes[1]||r.codes[0]||'',desc:r.desc,uom:r.uom||'KG',qty:r.qty}))};
  }},

 {id:'UNION',name:'Union Coop',
  detect:t=>/BRANCH ORDER FORM/i.test(t)&&/BOF/i.test(t),
  parse(lines,flat){
    const po=((flat.match(/\bBP\s*(\d{6,})/)||[])[1])||'';
    const delivery=(flat.match(/Requested Delivery Date\s*:\s*(\d{2}\/\d{2}\/\d{4})/i)||[])[1]||'';
    const bl=lines.find(l=>/\bBranch\b/.test(l.text)&&/\b\d{5}\b/.test(l.text)&&!/ORDER FORM/i.test(l.text))||lines.find(l=>/\d{5}\s+[A-Za-z].*Branch/.test(l.text));
    const m=bl&&bl.text.match(/\b\d{5}\s+(.+?Branch)\b/i);
    const branch=m?m[1].trim():'';
    const rows=readByColumns(lines,{headerRe:/^Sr\.?$/i,brandRe:/^Brand$/i,qtyRe:/^Quantity$/i,afterQtyRe:/^G \/ Cost/i,
      stopRe:/^(TOTAL|.*Delivery Should be made|.*TOTAL\s+[\d,.]+)/i});
    return {po,delivery,branch,lines:rows};
  }},
 {id:'BEAST',name:'Beast Meat',
  detect:t=>/Beast Meat Shop/i.test(t)&&/PURCHASE ORDER/i.test(t),
  parse(lines,flat){
    const di=lines.findIndex(l=>/^Document Number/i.test(l.text));
    const po=di>=0&&lines[di+1]?(lines[di+1].text.match(/^\d+/)||[''])[0]:'';
    const delivery=(flat.match(/Delivery Date:\s*(\d{2}\.\d{2}\.\d{2,4})/i)||[])[1]||'';
    const ai=lines.findIndex(l=>/^Delivery Address/i.test(l.text));
    const bl=ai>=0?lines.slice(ai+1,ai+6).find(l=>/\s-\s/.test(l.text)):null;
    const branch=bl?bl.text:'';
    const out=[];
    lines.forEach((L,i)=>{
      const t=L.items.map(x=>x.str.trim()).filter(Boolean);
      if(!/^\d{3}$/.test(t[0]||''))return;
      const u=t.findIndex((x,k)=>k>1&&/^(Kilogram|Kilograms|KG|KGS|Each|Piece|Pieces|Pcs|Tray|Trays|Box|Carton)$/i.test(x)&&/^[\d.,]+$/.test(t[k-1]));
      if(u<0)return;
      const next=(lines[i+1]&&lines[i+1].text)||'';
      out.push({code:(next.match(/Item Code:\s*(\S+)/i)||[])[1]||'',desc:t.slice(1,u-1).join(' '),
        uom:/^kilo|^kg/i.test(t[u])?'KG':'PCS',qty:num(t[u-1])});
    });
    return {po,delivery,branch,lines:out.filter(r=>r.qty>0)};
  }},
 {id:'TMA',name:'The Meat Avenue',
  detect:t=>/MEAT AVENUE/i.test(t)&&/Purchase Order\s*#/i.test(t),
  parse(lines,flat){
    const po=(flat.match(/Purchase Order\s*#\s*(P\d+)/i)||[])[1]||'';

      for(const L of lines.slice(si+1,si+4)){const s=L.items.filter(x=>x.x<lim).map(x=>x.str.trim()).join(' ').trim();if(s){branch=s;break}}}

    const dh=lines[h.li].items.find(x=>/^DATE/i.test(x.str.trim()));const xl=dh?dh.x-30:200;

  }},

    const hi=lines[h.li].items,xd=(hi.find(x=>/^Description/i.test(x.str))||{x:100}).x-5,xq=(hi.find(x=>/^Qty/i.test(x.str))||{x:210}).x-8;

    const near=y=>anchors.reduce((b,a)=>Math.abs(a.y-y)<Math.abs(b.y-y)?a:b);
    all.filter(x=>x.x>=xd&&x.x<xq).sort((a,b)=>a.y-b.y||a.x-b.x).forEach(x=>near(x.y).desc.push(x.str.trim()));
    anchors.forEach(a=>{const row=all.filter(x=>Math.abs(x.y-a.y)<3&&x.x>=xq).sort((p,q)=>p.x-q.x);
      const qi=row.findIndex(x=>/^[\d.,]+$/.test(x.str.trim()));if(qi>=0){a.qty=num(row[qi].str);const u=row[qi+1];if(u&&!/^kg/i.test(u.str.trim()))a.uom='PCS'}});
    return{po,delivery,branch,lines:anchors.map(a=>({code:a.code,desc:a.desc.join(' '),uom:a.uom,qty:a.qty})).filter(r=>r.desc&&r.qty>0)};
  }},
];

function suggestProduct(desc){
  const d=desc.toUpperCase().replace(/BONE\s+LESS/g,'BONELESS').replace(/SKIN\s+LESS/g,'SKINLESS');
  for(const[w,s]of PRODUCT_RULES)if(w.every(x=>d.includes(x)))return s+(/\b500\s*G/.test(d)?' 500g':'');
  return '';
}
function suggestBranch(raw,source){
  let r=raw;
  if(source==='UNION')r='Union '+raw.replace(/\s*Branch\s*$/i,'');
  if(source==='MLS')r='M L S '+raw.replace(/([a-z])([A-Z])/g,'$1 $2');
  if(source==='BEAST'){const p=raw.split(/\s+-\s+/);r='Beast Meat '+(p[1]||p[0])}
  if(source==='FF'){const m=raw.match(/^(.*?)\s*\(/);r='Food Fabrique '+(m?m[1]:raw)}
  if(source==='TMA')r=/FZCO/i.test(raw)?'Jabal lubnan':raw.replace(/L\.?L\.?C\.?$/i,'LLC');
  if(source==='GMG')r=raw.replace(/^GEANT EXPRESS\s*-\s*/i,'Geant - ').replace(/^GEANT\s*-\s*/i,'Geant - ');
  if(r==='Jabal lubnan')return r;
  return r.replace(/\s*[-–]\s*/g,' - ').split(/\s+/)
    .map(w=>w==='-'||['MLS','GMG','JLT','JVC','UAE','DIP','JBR','FZCO','LLC','FZE'].includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
}
function branchKey(source,raw){
  const k=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  return source+'|'+(source==='MLS'?k.slice(0,8):k);
}
function parseLpo(items){
  const lines=buildLines(items);const flat=lines.map(l=>l.text).join(' ');
  const p=PARSERS.find(p=>p.detect(flat));
  if(!p)return{error:'This LPO layout is not known yet (only '+PARSERS.map(p=>p.name).join(', ')+').'};
  const r=p.parse(lines,flat);
  if(!r.lines.length)return{error:'No product lines found in this '+p.name+' LPO.'};
  return{source:p.id,...r};
}

async function pdfItems(file){
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const items=[];let off=0;
  for(let p=1;p<=doc.numPages;p++){

async function ocr(){

function prep(bmp,{sx=0,sy=0,sw=bmp.width,sh=bmp.height,scale=1,thr=0,auto=false,pad=0}={}){
  sx=Math.max(0,Math.round(sx));sy=Math.max(0,Math.round(sy));sw=Math.round(Math.min(sw,bmp.width-sx));sh=Math.round(Math.min(sh,bmp.height-sy));
  const W=Math.round(sw*scale),H=Math.round(sh*scale),c=document.createElement('canvas');
  c.width=W+2*pad;c.height=H+2*pad;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.drawImage(bmp,sx,sy,sw,sh,pad,pad,W,H);
  const d=g.getImageData(0,0,c.width,c.height),p=d.data;let mn=255,mx=0;
  for(let i=0;i<p.length;i+=4){const v=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];p[i]=v;if(v<mn)mn=v;if(v>mx)mx=v}
  for(let i=0;i<p.length;i+=4){let v=p[i];if(auto&&mx>mn)v=(v-mn)*255/(mx-mn);if(thr)v=v>thr?255:0;p[i]=p[i+1]=p[i+2]=v}
  g.putImageData(d,0,0);return c;
}
function wordsOf(data){
  if(data.words&&data.words.length)return data.words;
  const out=[];(data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(pa=>(pa.lines||[]).forEach(l=>(l.words||[]).forEach(w=>out.push(w)))));
  return out;
}
function numCands(s){

  if(/^\d+(\.\d+)?$/.test(s))out.push(parseFloat(s));
  const d=s.replace(/\./g,'');
  if(/^\d+$/.test(d))for(const k of[2,3])if(d.length>k)out.push(parseFloat(d.slice(0,-k)+'.'+d.slice(-k)));
  return out;
}

}

  const tripleFor=(vals,prices)=>{for(let i=0;i<vals.length;i++)for(let j=i+1;j<vals.length;j++)for(let k=j+1;k<vals.length;k++){
    const[a,b,c]=[vals[i],vals[j],vals[k]];if(a>0&&prices.includes(b)&&Math.abs(a*b-c)<0.02)return a}return null};
  const byName=t=>{const s=suggestProduct(t);return s?Object.keys(U_ITEMS).find(c=>suggestProduct(U_ITEMS[c][0])===s)||null:null};
  const firstGuess={};
  for(const rot of[0,90,270,180]){
    status(`Looking for the table${rot?' (turning the picture)':''}…`);
    const img=rot?rotCanvas(base,rot):base;
    let hits=0;
    for(const psm of['6','4']){
      await w.setParameters({tessedit_pageseg_mode:psm,tessedit_char_whitelist:''});
      const d=(await w.recognize(img)).data;text+=' '+(d.text||'');
      for(const L of linesOf(d)){
        if(!L.length)continue;
        const lt=L.map(x=>x.t).join(' ');
        if(/TOTAL|Description|Quantity|Reqd/i.test(lt))continue;
        const it=L.find(x=>uItem(x.t));
        let code=it?uItem(it.t):null;const ax=it?it.x:-1;
        const vals=L.filter(x=>x.x>ax).sort((p,q)=>p.x-q.x).map(x=>uMoney(x.t)).filter(v=>v!=null);
        if(!code&&vals.length>=2)code=byName(lt);
        const y=L.reduce((s,x)=>s+x.y,0)/L.length,hh=L.reduce((s,x)=>s+x.h,0)/L.length;
        if(!code){
          if(psm==='6'&&/\bKG\b/.test(lt)&&vals.length>=2)unknown.push({y,hh,vals,rot});
          continue;
        }
        seen.add(code);hits++;(rowY[code]=rowY[code]||[]).push({y,rot});
        if(it&&firstGuess[code]==null){const g=vals.find(v=>v>0&&v<500&&!U_PRICES.includes(v));if(g!=null)firstGuess[code]=g}
        const q=tripleFor(vals,U_ITEMS[code][1]);if(q!=null&&res[code]==null)res[code]=q;
      }
      if(hits>=2&&!chosen)chosen={img,rot};
    }
    if(seen.size>=2)break;
  }
  if(!seen.size&&!unknown.length)return{error:'no Union Coop items were found in this picture. Try a straight, close photo, or use the PDF.'};
  // second method: match item rows and number rows by their order (handles tilted photos)
  if(chosen&&Object.keys(res).length<seen.size){
    status('Double-checking the quantities…');
    await w.setParameters({tessedit_pageseg_mode:'11',tessedit_char_whitelist:''});
    let d=(await w.recognize(chosen.img)).data;
    let W=(d.words||[]).map(x=>({t:x.text.trim(),x:(x.bbox.x0+x.bbox.x1)/2,y:(x.bbox.y0+x.bbox.y1)/2,h:x.bbox.y1-x.bbox.y0})).filter(x=>x.t);
    let hs=W.filter(x=>uItem(x.t));
    if(hs.length>=2){
      const n=hs.length,my=hs.reduce((s,h)=>s+h.y,0)/n,mx=hs.reduce((s,h)=>s+h.x,0)/n;
      const den=hs.reduce((s,h)=>s+(h.y-my)**2,0),a=den?hs.reduce((s,h)=>s+(h.y-my)*(h.x-mx),0)/den:0;
      const ang=Math.atan(a)*180/Math.PI;
      if(Math.abs(ang)>0.3){d=(await w.recognize(rotCanvas(chosen.img,-ang))).data;
        W=(d.words||[]).map(x=>({t:x.text.trim(),x:(x.bbox.x0+x.bbox.x1)/2,y:(x.bbox.y0+x.bbox.y1)/2,h:x.bbox.y1-x.bbox.y0})).filter(x=>x.t);hs=W.filter(x=>uItem(x.t))}
      const items=[];const s2=new Set();hs.sort((p,q)=>p.y-q.y).forEach(h=>{const c=uItem(h.t);if(!s2.has(c)){s2.add(c);items.push({c,h})}});
      if(items.length){
        const x0=Math.min(...items.map(i=>i.h.x)),hh=items.map(i=>i.h.h).sort((p,q)=>p-q)[items.length>>1]||20;
        const yt=Math.min(...items.map(i=>i.h.y))-40,yb=Math.max(...items.map(i=>i.h.y))+hh*3;
        const N=W.map(x=>({v:uMoney(x.t),x:x.x,y:x.y})).filter(o=>o.v!=null&&o.x>x0+hh*8&&o.y>yt&&o.y<yb).sort((p,q)=>p.y-q.y);
        const rows=[];N.forEach(o=>{const r=rows[rows.length-1];if(r&&Math.abs(o.y-r.y)<hh*0.8){r.v.push(o);r.y=r.v.reduce((s,z)=>s+z.y,0)/r.v.length}else rows.push({y:o.y,v:[o]})});
        const drows=rows.filter(r=>r.v.length>=3);
        if(drows.length===items.length)items.forEach((it,i)=>{
          const vals=drows[i].v.sort((p,q)=>p.x-q.x).map(z=>z.v);const q=tripleFor(vals,U_ITEMS[it.c][1]);
          if(q!=null&&res[it.c]==null)res[it.c]=q;seen.add(it.c)});
      }
    }
  }
  await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:''});
  const po=(text.match(/\bBP\s*(\d{8})/)||[])[1]||'';
  const delivery=(text.match(/Delivery Date\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i)||[])[1]||'';
  const bc=Object.keys(U_BRANCHES).find(k=>text.includes(k));
  const order=Object.keys(U_ITEMS);
  const lines=[...seen].sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(c=>({code:c,desc:U_ITEMS[c][0],uom:'KG',
    qty:res[c]!=null?res[c]:(firstGuess[c]||0),unverified:res[c]==null}));
  // rows with a quantity but no readable product: keep the quantity, the product is picked by hand
  const known=Object.values(rowY).flat();
  const extra=[];
  unknown.filter(u=>!known.some(k=>k.rot===u.rot&&Math.abs(k.y-u.y)<u.hh*0.8)).sort((p,q)=>p.y-q.y).forEach(u=>{
    if(extra.some(e=>e.rot===u.rot&&Math.abs(e.y-u.y)<u.hh*0.8))return;
    const q=tripleFor(u.vals,U_PRICES);const g=q!=null?q:u.vals.find(v=>v>0&&v<500&&!U_PRICES.includes(v));
    extra.push({rot:u.rot,y:u.y,line:{code:'',desc:'product not read, pick it',uom:'KG',qty:g||0,unverified:q==null,manual:true}});
  });
  lines.push(...extra.map(e=>e.line));
  return{source:'UNION',po,delivery,branch:bc?U_BRANCHES[bc]+' Branch':'',lines,image:URL.createObjectURL(file)};
}

let lpos=[];
const nkey=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const SOURCES=[['GMG','GMG'],['UNION','Union Coop'],['MLS','MLS'],['BEAST','Beast Meat'],['TMA','Meat Avenue'],['FF','Food Fabrique']];
// MLS: packed in 500 g trays (PO quantity is in kg); drumsticks and thigh are always skinless
function mlsName(base){
  if(!base)return base;
  const b=base.replace(/ 500g$/,'');
  if(b==='chicken')return 'chicken 1000g';
  if(b==='drumsticks')return 'drumsticks sl 500';
  if(b==='thigh')return 'thigh sl 500';
  return b+' 500';
}
// Food Fabrique: kg ordered, packed in 500 g trays, except whole chicken and tender (stay in kg)
const ffTray=b=>!!b&&!['chicken','tender breast'].includes(b.replace(/ 500g?$/,''));
function ffName(b){if(!b)return b;const x=b.replace(/ 500g?$/,'');return ffTray(x)?x+' 500':x}
function suggestFor(desc,source){
  const d=String(desc||'').toUpperCase().replace(/BONE\s+LESS/g,'BONELESS').replace(/SKIN\s+LESS/g,'SKINLESS');
  for(const r of (names.rules[source]||[])){
    const ws=String(r.w||'').split('+').map(x=>x.trim().toUpperCase()).filter(Boolean);
    if(ws.length&&ws.every(x=>d.includes(x)))return r.p;
  }
  let s=suggestProduct(desc);
  if(source==='MLS')s=mlsName(s);
  if(source==='FF')s=ffName(s);
  return s;
}
const prodKey=(source,l,sug)=>source==='MLS'?`MLS|${sug||nkey(l.desc)}`:`${source}|${l.code||nkey(l.desc)}`;
async function addFiles(files){
  const errs=[];const st=m=>$('#errs').innerHTML=`<p class="meta"><span class="spin"></span> ${esc(m)}</p>`;
  let n=0;
  for(const f of files){
    n++;st(`Reading ${n} of ${files.length}…`);
    try{
      const isImg=/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/i.test(f.name);
      const isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
      if(!isImg&&!isPdf){errs.push(`${f.name}: not a PDF or a picture.`);continue}
      let r;
      if(isImg){
        r=await readMlsImage(f,m=>st(`File ${n} of ${files.length}: ${m}`));
        if(r.error&&/not an MLS/i.test(r.error))r=await readUnionImage(f,m=>st(`File ${n} of ${files.length}: ${m}`));
      }else r=parseLpo(await pdfItems(f));
      if(r.error){errs.push(`${f.name}: ${r.error}`);continue}
      if(lpos.some(x=>x.source===r.source&&x.po&&x.po===r.po)){errs.push(`${f.name}: PO ${r.po} is already in the list.`);continue}
      const bKey=branchKey(r.source,r.branch);
      r.bKey=bKey;r.bSaved=!!names.branches[bKey];r.name=names.branches[bKey]||suggestBranch(r.branch,r.source);
      r.lines.forEach(l=>{
        const base=suggestProduct(l.desc);let sugB=base;
        if(r.source==='MLS'){sugB=mlsName(base);
          if(!l.trayDone&&base&&base.replace(/ 500g$/,'')!=='chicken'){l.qty=Math.round(l.qty*2*1000)/1000;l.trayDone=true}}
        if(r.source==='FF'&&!l.trayDone&&ffTray(base)){l.qty=Math.round(l.qty*2*1000)/1000;l.uom='PCS';l.trayDone=true}
        l.key=prodKey(r.source,l,sugB);
        l.saved=!!names.products[l.key];l.short=names.products[l.key]||suggestFor(l.desc,r.source);
        const sz=String(l.desc).match(/\b(\d{3,4})\s*(G|GM|GMS|GR|GRAM|GRAMS)\b/i);
        l.size=sz&&/^(whole )?chicken$/i.test(l.short)?sz[1]:'';});
      r.file=f.name;lpos.push(r);
    }catch(e){errs.push(`${f.name}: can't read this PDF (${e.message}).`)}
  }
  $('#errs').innerHTML=errs.length?`<div class="note bad">${errs.map(esc).join('<br>')}</div>`:'';
  render();
}
$('#file').onchange=()=>{addFiles([...$('#file').files]);$('#file').value=''};

      <td class="sz">${isWhole(l)?`<select data-sz="${i}:${j}" aria-label="Bird size">${sizeOpts(l.size)}</select>`:''}</td>

      <td class="dl"><button class="rmv" data-dl="${i}:${j}" aria-label="Delete item">×</button></td></tr>`).join('')}</table>

  $('#out').hidden=!lpos.length;

    const was=isWhole(l);l.short=e.value;if(!isWhole(l))l.size='';
    if(was!==isWhole(l)){render();return}
    e.classList.toggle('unset',!e.value);upd()});
  document.querySelectorAll('[data-q]').forEach(e=>e.oninput=()=>{const[i,j]=e.dataset.q.split(':');const l=lpos[i].lines[j];l.qty=parseFloat(e.value)||0;l.unverified=false;e.classList.remove('unv');upd()});
  document.querySelectorAll('[data-rm]').forEach(e=>e.onclick=()=>{lpos.splice(+e.dataset.rm,1);render()});
  document.querySelectorAll('[data-sz]').forEach(e=>e.onchange=()=>{const[i,j]=e.dataset.sz.split(':'),l=lpos[i].lines[j];
    if(e.value==='__other'){const v=(prompt('Bird size (grams):',l.size||'')||'').replace(/\D/g,'');l.size=v;render();return}
    l.size=e.value;upd()});
  document.querySelectorAll('[data-dl]').forEach(e=>e.onclick=()=>{const[i,j]=e.dataset.dl.split(':');lpos[i].lines.splice(+j,1);render()});
  document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{const r=lpos[+e.dataset.add];
    r.lines.push({code:'',desc:'added by hand',uom:r.source==='MLS'?'PCS':'KG',qty:0,short:'',manual:true,key:null,saved:false});
    render();const s=document.querySelector(`[data-p="${e.dataset.add}:${r.lines.length-1}"]`);if(s)s.focus()});
  document.querySelectorAll('[data-cp]').forEach(e=>e.onclick=()=>{const r=lpos[+e.dataset.cp];copyText(msg(r),e,'Copy');remember(r)});
  document.querySelectorAll('[data-wa]').forEach(e=>e.onclick=async()=>{
    const r=lpos[+e.dataset.wa];
    if(r.lines.some(l=>l.unverified)&&!confirm('Some quantities were not confirmed from the image. Did you check them?'))return;
    remember(r);if(await shareText(msg(r))){r.sent=true;render()}});
  upd();
}
const unitOf=(u,src)=>/^KGS?$/.test(u)?((names.opts[src]||{}).kg??'kg'):/^(PCS|PC|EA|EACH|NOS|UNIT)$/.test(u)?'':String(u||'').toLowerCase();
function msg(r){
  const po=$('#withPo').checked;
  return [r.name.trim()+(po&&r.po?`\nPO ${r.po}`:''),'',
    ...mergeLines(r.lines,r.source).map(l=>`${q2(l.qty)} ${unitOf(l.uom,r.source)?unitOf(l.uom,r.source)+' ':''}${l.short}`)].join('\n');
}
const isWhole=l=>/^(whole )?chicken$/i.test(String(l.short||'').trim());
function sizeOpts(cur){
  const list=['700','800','900','1000','1100','1200','1300','1400','1500','1600'];
  if(cur&&!list.includes(cur))list.push(cur);
  return `<option value=""${cur?'':' selected'}>size</option>`+list.map(v=>`<option value="${v}"${v===cur?' selected':''}>${v}</option>`).join('')+'<option value="__other">other…</option>';
}
function prodOpts(cur){
  const list=[...new Set([...BASE_PRODUCTS,...Object.values(names.products)])].sort();
  if(cur&&!list.includes(cur))list.unshift(cur);
  return (cur?'':'<option value="" selected>Choose product…</option>')+
    list.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('')+
    '<option value="__other">Other (type it)…</option>';
}
function markSaved(){document.querySelectorAll('.tag.check').forEach(t=>{t.className='tag saved';t.textContent='saved'})}
function mergeLines(ls,src){
  const m=new Map();
  ls.filter(l=>l.short.trim()&&l.qty>0).forEach(l=>{const name=l.short.trim()+(isWhole(l)&&l.size?' '+l.size:'');const k=name+'|'+unitOf(l.uom,src);
    if(m.has(k))m.get(k).qty+=l.qty;else m.set(k,{short:name,uom:l.uom,qty:l.qty})});
  return[...m.values()];
}

async function copyText(t,btn,label){

  if(!ok){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}
  btn.textContent=ok?'Copied':'Copy failed';setTimeout(()=>btn.textContent=label,1800);
}

async function remember(only){

    if(r.name.trim()&&names.branches[r.bKey]!==r.name.trim())jobs.push(saveName('branches',r.bKey,r.name.trim()));
    r.lines.forEach(l=>{if(!l.manual&&l.short.trim()&&names.products[l.key]!==l.short.trim()){jobs.push(saveName('products',l.key,l.short.trim()));
      if(names.descs[l.key]!==l.desc)jobs.push(saveName('descs',l.key,l.desc))}});
  });
  try{await Promise.all(jobs)}catch(e){$('#errs').innerHTML=`<div class="note bad">Names not saved: ${esc(e.message)}</div>`;return}
  (only?[only]:lpos).forEach(r=>{r.bSaved=true;r.lines.forEach(l=>l.saved=!l.manual&&!!l.short.trim())});
  if(!fb){refreshLists();renderSettings()}

}

  </section>
  <section class="sset"><h3>Weight unit</h3>
    <div class="srow"><span class="t">Write kilograms as</span><select id="kgopt" style="width:120px;flex:none">${['kg','KG','Kg','kgs',''].map(v=>`<option value="${v}"${v===kg?' selected':''}>${v?v:'(nothing)'}</option>`).join('')}</select></div>
  </section>
  <section class="sset"><h3>Customer names</h3>
    ${br.map(([k,v])=>`<div class="srow"><span class="t"><small>${esc(k.slice(pre.length))}</small><input data-bk="${esc(k)}" value="${esc(v)}"></span><button class="del" data-db="${esc(k)}">Delete</button></div>`).join('')||'<div class="srow meta">No saved customer names yet. They are saved when you send an order.</div>'}
  </section>
  <section class="sset"><h3>Product names</h3>
    ${pr.map(([k,v])=>`<div class="srow"><span class="t"><small>${esc(names.descs[k]||k.slice(pre.length))}</small><select data-pk="${esc(k)}">${prodOpts(v)}</select></span><button class="del" data-dp="${esc(k)}">Delete</button></div>`).join('')||'<div class="srow meta">No saved product names yet.</div>'}
  </section>`;
  const sb=$('#sbody');
  $('#radd').onclick=async()=>{const w=$('#rw').value.trim(),p=$('#rp').value;
    if(!w||!p||p==='__other'){alert('Type the words and pick the product.');return}
    await saveName('rules',sTab,[...rules,{w,p}]);renderSettings();reapply()};
  sb.querySelectorAll('[data-rr]').forEach(b=>b.onclick=async()=>{const n=rules.slice();n.splice(+b.dataset.rr,1);await saveName('rules',sTab,n);renderSettings();reapply()});
  $('#kgopt').onchange=async e=>{await saveName('opts',sTab,{...(names.opts[sTab]||{}),kg:e.target.value});render()};
  sb.querySelectorAll('[data-bk]').forEach(i=>i.onchange=async()=>{if(i.value.trim())await saveName('branches',i.dataset.bk,i.value.trim());lpos.forEach(r=>{if(r.bKey===i.dataset.bk)r.name=i.value.trim()});render()});
  sb.querySelectorAll('[data-db]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this saved customer name?'))return;await removeName('branches',b.dataset.db);renderSettings()});
  sb.querySelectorAll('[data-pk]').forEach(s=>s.onchange=async()=>{let v=s.value;
    if(v==='__other'){v=(prompt('Product name as you write it in the group:')||'').trim();if(!v){renderSettings();return}}
    await saveName('products',s.dataset.pk,v);lpos.forEach(r=>r.lines.forEach(l=>{if(l.key===s.dataset.pk)l.short=v}));render();renderSettings()});
  sb.querySelectorAll('[data-dp]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this saved product name?'))return;await removeName('products',b.dataset.dp);renderSettings();reapply()});
}

(async()=>{
  try{if(await initStore()){showApp();refreshLists()}}
  catch(e){document.body.insertAdjacentHTML('beforeend',`<div class="wrap"><div class="note bad">Could not start: ${esc(e.message)}</div></div>`)}
})();
</script>
</body>
</html>
